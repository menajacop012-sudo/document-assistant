services:
  doc-assistant:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Ollama runs on your machine, not inside the container
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      # Makes host.docker.internal work on Linux too
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
